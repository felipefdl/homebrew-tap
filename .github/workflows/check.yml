name: Check casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Taps this checkout as felipefdl/tap.
      - id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Style
        run: brew style --cask felipefdl/tap

      - name: Audit
        run: |
          set -euo pipefail
          for cask in Casks/*.rb; do
            brew audit --cask --strict --online "felipefdl/tap/$(basename "$cask" .rb)"
          done
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
